name: Hedge Helper Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate source segments
        shell: pwsh
        run: |
          $expected = @('00.b64','01.b64','02.b64','03.b64','04.b64','05.b64')
          foreach ($name in $expected) {
            if (!(Test-Path "payload/$name")) { throw "Missing source segment: $name" }
          }
          $actual = @(Get-ChildItem payload -Filter '*.b64' | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw "Unexpected source segment list: $($actual -join ',')" }

      - name: Restore source archive
        shell: pwsh
        run: |
          $encoded = (Get-ChildItem payload -Filter '*.b64' | Sort-Object Name | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$PWD/source.tar.xz", $bytes)
          tar -xf source.tar.xz
          if (!(Test-Path 'HedgeHelper_v0.1.0/run.py')) { throw 'Cannot restore source project.' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HedgeHelper_v0.1.0/requirements.txt

      - name: Static compile check
        run: python -m compileall -q HedgeHelper_v0.1.0/hedge_helper HedgeHelper_v0.1.0/run.py

      - name: Unit tests
        working-directory: HedgeHelper_v0.1.0
        run: python -m pytest -q tests

      - name: Build Windows executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name HedgeHelper --paths HedgeHelper_v0.1.0
          --collect-all pytesseract --collect-all PIL
          HedgeHelper_v0.1.0/run.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/HedgeHelper.exe release/HedgeHelper.exe
          Copy-Item HedgeHelper_v0.1.0/README.md release/README_RU.md
          Copy-Item HedgeHelper_v0.1.0/TEST_REPORT.md release/TEST_REPORT.md
          Copy-Item HedgeHelper_v0.1.0/requirements.txt release/requirements.txt
          Compress-Archive -Path release/* -DestinationPath HedgeHelper_v0.1.0_Windows_x64.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Hedge Helper v0.1.0 — Windows x64
          draft: false
          prerelease: true
          files: |
            dist/HedgeHelper.exe
            HedgeHelper_v0.1.0_Windows_x64.zip
