name: Hedge Helper Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'ci/**'
      - '.github/scripts/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate source segments
        shell: pwsh
        run: |
          $expected = @('00.b64','01.b64','02.b64','03.b64','04.b64','05.b64')
          foreach ($name in $expected) {
            if (!(Test-Path "payload/$name")) { throw "Missing source segment: $name" }
          }
          $actual = @(Get-ChildItem payload -Filter '*.b64' | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw "Unexpected source segment list: $($actual -join ',')" }

      - name: Restore source archive
        shell: pwsh
        run: |
          $encoded = (Get-ChildItem payload -Filter '*.b64' | Sort-Object Name | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$PWD/source.tar.xz", $bytes)
          tar -xf source.tar.xz
          if (!(Test-Path 'HedgeHelper_v0.1.0/run.py')) { throw 'Cannot restore source project.' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HedgeHelper_v0.1.0/requirements.txt

      - name: Static compile check
        run: python -m compileall -q HedgeHelper_v0.1.0/hedge_helper HedgeHelper_v0.1.0/run.py

      - name: Unit tests
        working-directory: HedgeHelper_v0.1.0
        run: python -m pytest -q tests

      - name: Prepare bundled Tesseract OCR
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File .github/scripts/prepare_tesseract.ps1

      - name: Patch app to use bundled Tesseract
        run: python ci/patch_ocr_runtime.py

      - name: Compile patched OCR module
        run: python -m compileall -q HedgeHelper_v0.1.0/hedge_helper HedgeHelper_v0.1.0/run.py

      - name: OCR smoke test (source)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/HedgeHelper_v0.1.0"
          python -c "from hedge_helper.ocr_engine import OcrEngine; engine = OcrEngine(); print('Source OCR smoke test:', engine.version, engine.languages)"

      - name: Build and run frozen OCR smoke test
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name OcrRuntimeSmoke --paths HedgeHelper_v0.1.0 --collect-all pytesseract --collect-all PIL --add-data "HedgeHelper_v0.1.0/tesseract_runtime;tesseract_runtime" .github/scripts/ocr_runtime_smoke.py
          Remove-Item Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          & "$PWD/dist/OcrRuntimeSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Frozen OCR smoke test failed with exit code $LASTEXITCODE" }

      - name: Build Windows executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name HedgeHelper --paths HedgeHelper_v0.1.0
          --collect-all pytesseract --collect-all PIL
          --add-data "HedgeHelper_v0.1.0/tesseract_runtime;tesseract_runtime"
          HedgeHelper_v0.1.0/run.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/HedgeHelper.exe release/HedgeHelper.exe
          Copy-Item .github/scripts/README_RU.md release/README_RU.md
          Copy-Item HedgeHelper_v0.1.0/TEST_REPORT.md release/TEST_REPORT.md
          Add-Content release/TEST_REPORT.md "`n## Windows OCR bundle smoke test`n- Tesseract 5.5.3; bundled models rus+eng; source and frozen one-file OCR startup checks passed."
          Copy-Item HedgeHelper_v0.1.0/requirements.txt release/requirements.txt
          Copy-Item HedgeHelper_v0.1.0/tesseract_runtime/LICENSE-TESSERACT.txt release/
          Copy-Item HedgeHelper_v0.1.0/tesseract_runtime/LICENSE-TESSDATA-FAST.txt release/
          Compress-Archive -Path release/* -DestinationPath HedgeHelper_v0.1.0_Windows_x64.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Hedge Helper v0.1.0 — Windows x64
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            dist/HedgeHelper.exe
            HedgeHelper_v0.1.0_Windows_x64.zip
