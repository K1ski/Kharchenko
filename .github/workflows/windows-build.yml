name: Hedge Helper Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'ci/apply_speed_upgrade.py'
      - 'ci/inspect_source_outline.py'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Hedge Helper source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path payload -Filter '*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'Source archive parts are missing.' }
          $encoded = ($parts | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$PWD\source.tar.xz", $bytes)
          tar -xf source.tar.xz
          if (!(Test-Path 'HedgeHelper_v0.1.0\run.py')) { throw 'Source archive extraction failed.' }

      - name: Apply fast-flow and monitor fixes
        run: python ci/apply_speed_upgrade.py

      - name: Inspect restored source outline
        run: python -X utf8 ci/inspect_source_outline.py --dump

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HedgeHelper_v0.1.0/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q HedgeHelper_v0.1.0/hedge_helper HedgeHelper_v0.1.0/run.py

      - name: Run automated tests
        working-directory: HedgeHelper_v0.1.0
        run: python -m pytest -q tests

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name HedgeHelper --paths HedgeHelper_v0.1.0
          --collect-all pytesseract --collect-all PIL
          HedgeHelper_v0.1.0/run.py

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/HedgeHelper.exe release/HedgeHelper.exe
          Copy-Item HedgeHelper_v0.1.0/README.md release/README_RU.md
          Copy-Item HedgeHelper_v0.1.0/TEST_REPORT.md release/TEST_REPORT.md
          Copy-Item HedgeHelper_v0.1.0/requirements.txt release/requirements.txt
          Compress-Archive -Path release/* -DestinationPath HedgeHelper_v0.1.1_Windows_x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HedgeHelper_v0.1.1_Windows_x64
          path: |
            dist/HedgeHelper.exe
            HedgeHelper_v0.1.1_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14
